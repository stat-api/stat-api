# Generated — do not edit. Compile-only: proves every example in cookbook/ still builds
# against the published SDKs. No secrets, no live API calls.
# There is no push trigger. A release mirrors this repo first and publishes the packages
# after, so a run on that push would fail until the packages exist. Run it by hand after a release.
name: compile

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cookbook/typescript } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install
      - run: npx tsc --noEmit

  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cookbook/python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m compileall .

  go:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cookbook/go } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - run: go build ./...

  java:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cookbook/java } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: gradle compileJava

